<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#000000">
        <title>Unit Converter</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
        <link rel="manifest" href="manifest.json">
    </head>
    <body>
        <main class="converter">
            <h1>Unit Converter</h1>
            <p class="message">For my dearest Mother</p>
            <section class="conversion">
                <h2>Pounds - Kilograms</h2>
                    <div class="input-row">
                        <input type="number" id="lb" placeholder="Lb." step="any">
                        <input type="number" id="kg" placeholder="Kg." step="any">
                    </div>
            </section>
            <section class="conversion">
                <h2>Inches - Centimeters</h2>
                    <div class="input-row">
                        <input type="number" id="in" placeholder="In." step="any">
                        <input type="number" id="cm" placeholder="Cm." step="any">
                    </div>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
